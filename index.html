<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Mierenhoofd · Ontwerpmodus v1</title><style>body{margin:0;background:#10151d;color:#e8edf5;font:14px system-ui}header{padding:12px 16px;background:#1b2430;display:flex;justify-content:space-between}main{display:flex;height:calc(100dvh - 52px)}#stage{flex:1;touch-action:none;min-width:0}aside{width:230px;background:#1b2430;padding:15px;overflow:auto}button{background:#34475b;color:white;border:1px solid #52667a;border-radius:7px;padding:9px;margin:3px;cursor:pointer}button:hover{background:#536b84}label{display:block;margin:15px 0 5px}input{width:100%}small{color:#aebdcc} @media(max-width:700px){main{flex-direction:column}#stage{min-height:55dvh}aside{width:auto;flex:1;padding:10px}header{font-size:12px}}</style></head><body><header><b>🐜 MIERENHOOFD · ONTWERPMODUS v1</b><span>Lasius niger · kopkapsel</span></header><main><div id="stage"></div><aside><b>Aanzichten</b><div><button data-view="front">Voor</button><button data-view="side">Zij</button><button data-view="top">Boven</button><button data-view="bottom">Onder</button><button data-view="back">Achter</button><button data-view="three">3/4</button></div><label>Breedte <output id="wv">1.00</output></label><input id="w" type="range" min="0.7" max="1.3" step="0.01" value="1"><label>Hoogte <output id="hv">1.00</output></label><input id="h" type="range" min="0.7" max="1.3" step="0.01" value="1"><label>Diepte <output id="dv">1.00</output></label><input id="d" type="range" min="0.7" max="1.3" step="0.01" value="1"><label><input id="wire" type="checkbox" style="width:auto"> Draadmodel</label><button id="reset">Herstel vorm</button><button id="export">Exporteer instellingen</button><p><small>Sleep: draaien · twee vingers: verschuiven/inzoomen · muiswiel: zoom · rechter muisknop: verschuiven.</small></p><p><small>Alleen kopkapsel. Geen vastgeplakte kaken, antennen of ogen. Vorm is een voorlopige 3D-benadering, geen exacte anatomische scan.</small></p></aside></main><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/controls/OrbitControls.js';
const stage=document.querySelector('#stage'),scene=new THREE.Scene();scene.background=new THREE.Color('#10151d');const camera=new THREE.PerspectiveCamera(40,1,.01,100);camera.position.set(2.5,1.7,3.5);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));stage.append(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enablePan=true;controls.minDistance=.8;controls.maxDistance=12;scene.add(new THREE.HemisphereLight(0xcde5ff,0x392719,2));let light=new THREE.DirectionalLight(0xffffff,2.4);light.position.set(3,5,5);scene.add(light);const grid=new THREE.GridHelper(4,20,0x435064,0x273343);grid.position.y=-.95;scene.add(grid);
// Coordinate convention: front = +Z; top = +Y. Anatomical approximation of capsule only.
const geo=new THREE.SphereGeometry(1,72,48),p=geo.attributes.position;for(let i=0;i<p.count;i++){let x=p.getX(i),y=p.getY(i),z=p.getZ(i);let lower=(1-Math.max(0,-y)*.20), rear=(z<0?1.02:1), taper=1-.11*Math.max(0,z)*Math.max(0,-y);p.setXYZ(i,x*.73*lower*taper*rear,y*.78,z*.61*(1+.08*y));}geo.computeVertexNormals();const material=new THREE.MeshStandardMaterial({color:0x61422f,roughness:.68,metalness:.03,flatShading:false});const head=new THREE.Mesh(geo,material);scene.add(head);
function resize(){let w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(stage);resize();const poses={front:[0,0,3.6],back:[0,0,-3.6],side:[3.6,0,0],top:[0,3.6,0],bottom:[0,-3.6,0],three:[2.5,1.7,3.5]};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{camera.position.set(...poses[b.dataset.view]);controls.target.set(0,0,0);camera.lookAt(0,0,0);controls.update()});for(const [id,axis] of [['w','x'],['h','y'],['d','z']])document.getElementById(id).oninput=e=>{head.scale[axis]=+e.target.value;document.getElementById(id+'v').textContent=(+e.target.value).toFixed(2)};document.getElementById('wire').onchange=e=>material.wireframe=e.target.checked;document.getElementById('reset').onclick=()=>{for(let id of ['w','h','d']){let el=document.getElementById(id);el.value=1;el.dispatchEvent(new Event('input'))}material.wireframe=false;document.getElementById('wire').checked=false};document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify({project:'Mierenhoofd',version:1,part:'head_capsule',width:head.scale.x,height:head.scale.y,depth:head.scale.z},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mierenhoofd_kopkapsel.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script></body></html>
